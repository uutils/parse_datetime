on:
  push:
    branches: [main]
  pull_request:

name: Basic CI

permissions:
  contents: read

# A new push supersedes the older run for the same branch or pull request.
# This prevents repeated pushes from multiplying the full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_MIN_SRV: "1.71.1"

jobs:
  quality:
    name: Stable quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Each step uses GitHub Actions' default `success()` condition, so a
      # failed check does not start the more expensive steps for that OS.
      - name: cargo check
        run: cargo check
      - name: cargo test
        run: cargo test
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: cargo fmt --all -- --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  min_version:
    name: Minimum Supported Rust Version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_MIN_SRV }}
      - run: cargo check

  coverage:
    name: Code Coverage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Let every OS upload to Codecov even if another coverage job fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: emulate nightly toolchain
      run: echo "RUSTC_BOOTSTRAP=1" >> "${GITHUB_ENV}"
    - name: Initialize workflow variables
      id: vars
      shell: bash
      run: |
        # * CODECOV_FLAGS
        CODECOV_FLAGS=$(echo "${{ matrix.os }}" | sed 's/[^[:alnum:]]/_/g')
        echo "CODECOV_FLAGS=${CODECOV_FLAGS}" >> "$GITHUB_OUTPUT"

    - name: rust toolchain ~ install
      uses: dtolnay/rust-toolchain@nightly # this job is not reproducible...
      with:
        components: llvm-tools-preview
    - name: Test
      run: cargo test --no-fail-fast
      env:
        RUSTC_WRAPPER: ""
        RUSTFLAGS: "-Cinstrument-coverage -Zcoverage-options=branch -Ccodegen-units=1 -Copt-level=0 -Coverflow-checks=off -Zpanic_abort_tests -Cpanic=abort"
        RUSTDOCFLAGS: "-Cpanic=abort"
        LLVM_PROFILE_FILE: "parse_datetime-%p-%m.profraw"
    - name: "`grcov` ~ install"
      shell: bash
      run: |
        git clone --depth=1 https://github.com/mozilla/grcov.git ~/grcov/
        cd ~/grcov
        # Hardcode the version of crossbeam-epoch. See
        # https://github.com/uutils/coreutils/issues/3680
        sed -i -e "s|tempfile =|crossbeam-epoch = \"=0.9.8\"\ntempfile =|" Cargo.toml
        cargo install --path . --locked
        cd -
# Uncomment when the upstream issue
# https://github.com/mozilla/grcov/issues/849 is fixed
#      uses: actions-rs/install@v0.1
#      with:
#        crate: grcov
#        version: latest
#        use-tool-cache: false
    - name: Generate coverage data (via `grcov`)
      id: coverage
      shell: bash
      run: |
        ## Generate coverage data
        COVERAGE_REPORT_DIR="target/debug"
        COVERAGE_REPORT_FILE="${COVERAGE_REPORT_DIR}/lcov.info"
        mkdir -p "${COVERAGE_REPORT_DIR}"
        # display coverage files
        grcov . --binary-path="${COVERAGE_REPORT_DIR}" --output-type files --ignore build.rs --ignore "vendor/*" --ignore "/*" --ignore "[a-zA-Z]:/*" --excl-br-line "^\s*((debug_)?assert(_eq|_ne)?!|#\[derive\()" | sort --unique
        # generate coverage report
        grcov . --binary-path="${COVERAGE_REPORT_DIR}" --output-type lcov --output-path "${COVERAGE_REPORT_FILE}" --branch --ignore build.rs --ignore "vendor/*" --ignore "/*" --ignore "[a-zA-Z]:/*" --excl-br-line "^\s*((debug_)?assert(_eq|_ne)?!|#\[derive\()" --source-dir .
        echo "report=${COVERAGE_REPORT_FILE}" >> $GITHUB_OUTPUT
    - name: Upload coverage results (to Codecov.io)
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.coverage.outputs.report }}
        flags: ${{ steps.vars.outputs.CODECOV_FLAGS }}
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
        directory: ./
        root_dir: ./

  fuzz:
    name: Run the fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_FOR: 60
      # cargo-fuzz uses nightly features
      RUSTC_BOOTSTRAP: 1
    steps:
    - uses: actions/checkout@v7
    - name: Install `cargo-fuzz`
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz
    - uses: Swatinem/rust-cache@v2
    - name: Run fuzz_parse_datetime for XX seconds
      shell: bash
      run: |
        ## Run it
        cd fuzz
        # https://github.com/rust-fuzz/cargo-fuzz/issues/398
        cargo fuzz run --target host-tuple fuzz_parse_datetime -- -max_total_time=${{ env.RUN_FOR }} -detect_leaks=0
    - name: Run fuzz_large_year for XX seconds
      shell: bash
      run: |
        ## Run it
        cd fuzz
        cargo fuzz run --target host-tuple fuzz_large_year -- -max_total_time=${{ env.RUN_FOR }} -detect_leaks=0
